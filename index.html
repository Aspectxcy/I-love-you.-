<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flowers In Every Language 🌸</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #030305;
      color: #fce7f3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      overflow-y: auto;
    }
    /* Top Header Bar */
    header {
      width: 100%;
      max-width: 900px;
      padding: 16px 20px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      background: rgba(255, 45, 117, 0.12);
      border: 1px solid rgba(255, 45, 117, 0.35);
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fda4af;
    }
    .flower-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(18, 18, 22, 0.85);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #a1a1aa;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }
    .tab-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, #e11d48, #ec4899);
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.35);
    }
    /* Main Canvas Stage */
    main {
      flex: 1;
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px 16px;
    }
    .canvas-card {
      position: relative;
      width: 100%;
      max-width: 580px;
      aspect-ratio: 9 / 13;
      max-height: 70vh;
      background: #000000;
      border-radius: 24px;
      box-shadow: 0 0 50px rgba(244, 63, 94, 0.15), 0 20px 40px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    /* Word Hover Card */
    #tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(15, 15, 20, 0.95);
      border: 1px solid rgba(244, 114, 182, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 12px;
      color: #fff;
      display: none;
      z-index: 50;
      transform: translate(-50%, -120%);
      white-space: nowrap;
    }
    #tooltip .lang {
      color: #f472b6;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #tooltip .trans {
      color: #e4e4e7;
      font-size: 13px;
      margin-top: 2px;
    }
    /* Bottom Controls Dock */
    footer {
      width: 100%;
      max-width: 700px;
      padding: 12px 16px 24px;
      z-index: 10;
    }
    .dock {
      background: rgba(18, 18, 24, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }
    .play-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      border: none;
      color: white;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
      flex-shrink: 0;
    }
    .play-btn:active {
      transform: scale(0.92);
    }
    .reset-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #d4d4d8;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }
    .reset-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }
    .slider-group {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-txt {
      font-size: 11px;
      font-family: monospace;
      color: #a1a1aa;
      width: 38px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #ec4899;
      height: 5px;
      border-radius: 4px;
      background: #27272a;
      cursor: pointer;
    }
    .dedication-badge {
      font-size: 11px;
      padding: 3px 10px;
      background: rgba(236, 72, 153, 0.15);
      border: 1px solid rgba(236, 72, 153, 0.35);
      color: #fda4af;
      border-radius: 8px;
      white-space: nowrap;
    }
  </style>
</head>

  <!-- Header -->
  <header>
    <div class="badge">
      <span>Multilingual Botanical Art</span>
    </div>

    <!-- Flower Chooser Tabs -->
    <div class="flower-tabs">
      <button class="tab-btn" data-flower="pink_rose">🌸 Pink Rose</button>
      <button class="tab-btn" data-flower="pink_lily">🌺 Pink Lily</button>
      <button class="tab-btn" data-flower="red_rose">🌹 Red Rose</button>
      <button class="tab-btn" data-flower="golden_sunflower">🌻 Sunflower</button>
      <button class="tab-btn" data-flower="royal_tulip">🌷 Tulip</button>
      <button class="tab-btn" data-flower="white_rose">🤍 White Rose</button>
    </div>
  </header>

  <!-- Interactive Canvas Viewport -->
  <main>
    <div class="canvas-card" id="cardContainer">
      <canvas id="flowerCanvas"></canvas>
      <div id="tooltip">
        <div class="lang" id="tooltipLang">LANGUAGE</div>
        <div class="trans" id="tooltipText">Translation</div>
      </div>
    </div>
  </main>

  <!-- Bottom Timeline & Controls Dock -->
  <footer>
    <div class="dock">
      <button class="play-btn" id="playBtn" title="Play / Pause Bloom">▶</button>
      <button class="reset-btn" id="resetBtn" title="Restart from Seed">↺</button>
      
      <div class="slider-group">
        <span class="progress-txt" id="progressLabel">100%</span>
        <input type="range" id="bloomRange" min="0" max="1" step="0.005" value="1.0" />
      </div>

      <div class="dedication-badge" id="recipientBadge" style="display: none;">
        For <span id="recipientSpan"></span>
      </div>
    </div>
  </footer>

              text: w.text,
              x: Math.round(curX + w.width / 2),
              y: y,
              width: w.width,
              height: w.fontSize + 4,
              fontSize: w.fontSize,
              fontWeight: '700',
              color: palette.stem[(rIdx + idCounter) % palette.stem.length],
              part: 'leaf',
              order: 0.18 + (rIdx / 15),
              isGreen: true
            });
            curX += w.width + gap;
          });
        });

        // Lower Stem
        const lowerStemStartY = leftLeafStartY + (ROSE_STEM.leftLeaf.length * headRowHeight);
        ROSE_STEM.lowerStem.forEach((row, rIdx) => {
          const y = Math.round(lowerStemStartY + rIdx * headRowHeight);
          const gap = Math.max(6, Math.round(8 * scale));
          const wordSpans = row.map(w => {
            const fontSize = Math.max(9, Math.round(10 * scale));
            return { ...w, fontSize, width: Math.round(w.text.length * fontSize * 0.62) };
          });
          const totalW = wordSpans.reduce((a, b) => a + b.width, 0) + (wordSpans.length - 1) * gap;
          let curX = cx - totalW / 2;

          wordSpans.forEach(w => {
            elements.push({
              id: `lower-stem-${idCounter++}`,
              phrase: getPhraseForWord(w.text),
              text: w.text,
              x: Math.round(curX + w.width / 2),
              y: y,
              width: w.width,
              height: w.fontSize + 4,
              fontSize: w.fontSize,
              fontWeight: '700',
              color: palette.stem[(rIdx + idCounter) % palette.stem.length],
              part: 'stem',
              order: 0.05 + (rIdx / 30),
              isGreen: true
            });
            curX += w.width + gap;
          });
        });

      } else if (flowerType === 'pink_lily') {
        const lilyRowHeight = Math.max(13, Math.round(15.5 * scale));
        const lilyStartY = cy - (LILY_ROWS.length * lilyRowHeight * 0.48);

        LILY_ROWS.forEach((row, rowIndex) => {
          const y = Math.round(lilyStartY + rowIndex * lilyRowHeight);
          const wordSpans = row.map(w => {
            const isLarge = w.isBold || w.isBright;
            const fontSize = Math.max(9.5, Math.round((isLarge ? 12.5 : 10.5) * scale));
            return { ...w, fontSize, width: Math.round(w.text.length * fontSize * 0.62) };
          });
          const gap = Math.max(7, Math.round(9.5 * scale));
          const totalW = wordSpans.reduce((a, b) => a + b.width, 0) + (wordSpans.length - 1) * gap;
          let curX = cx - totalW / 2;

          wordSpans.forEach(w => {
            let color;
            if (w.isBright) color = palette.highlights[0];
            else if (w.isBold) color = palette.petals[0];
            else color = palette.petals[(rowIndex + idCounter) % palette.petals.length];

            elements.push({
              id: `lily-petal-${idCounter++}`,
              phrase: getPhraseForWord(w.text),
              text: w.text,
              x: Math.round(curX + w.width / 2),
              y: y,
              width: w.width,
              height: w.fontSize + 4,
              fontSize: w.fontSize,
              fontWeight: w.isBold ? '800' : '600',
              color: color,
              part: 'petal',
              order: 0.28 + (1 - rowIndex / LILY_ROWS.length) * 0.72,
              isGreen: false
            });
            curX += w.width + gap;
          });
        });

        // Lily Foliage & Stem
        const foliageStartY = lilyStartY + (LILY_ROWS.length * lilyRowHeight) + 4;
        LILY_FOLIAGE.stem.forEach((row, rIdx) => {
          const y = Math.round(foliageStartY + rIdx * lilyRowHeight);
          const gap = Math.max(6, Math.round(8 * scale));
          const wordSpans = row.map(w => {
            const fontSize = Math.max(9, Math.round(10 * scale));
            return { ...w, fontSize, width: Math.round(w.text.length * fontSize * 0.62) };
          });
          const totalW = wordSpans.reduce((a, b) => a + b.width, 0) + (wordSpans.length - 1) * gap;
          let curX = cx - totalW / 2;

          wordSpans.forEach(w => {
            elements.push({
              id: `lily-stem-${idCounter++}`,
              phrase: getPhraseForWord(w.text),
              text: w.text,
              x: Math.round(curX + w.width / 2),
              y: y,
              width: w.width,
              height: w.fontSize + 4,
              fontSize: w.fontSize,
              fontWeight: '700',
              color: palette.stem[(rIdx + idCounter) % palette.stem.length],
              part: 'stem',
              order: 0.05 + (rIdx / 25),
              isGreen: true
            });
            curX += w.width + gap;
          });
        });

      } else {
        // Fallback for Sunflower / Tulip
        const baseRowHeight = Math.max(13, Math.round(15.5 * scale));
        const baseStartY = cy - (ROSE_HEAD.length * baseRowHeight * 0.52);

        ROSE_HEAD.forEach((row, rowIndex) => {
          const y = Math.round(baseStartY + rowIndex * baseRowHeight);
          const validWords = row.filter(w => w.text.trim().length > 0);
          if (!validWords.length) return;

          const wordSpans = validWords.map(w => {
            const isLarge = w.isBold || w.isBright;
            const fontSize = Math.max(9.5, Math.round((isLarge ? 12.5 : 10.5) * scale));
            return { ...w, fontSize, width: Math.round(w.text.length * fontSize * 0.62) };
          });

          const gap = Math.max(7, Math.round(9.5 * scale));
          const totalW = wordSpans.reduce((a, b) => a + b.width, 0) + (wordSpans.length - 1) * gap;
          let curX = cx - totalW / 2;

          wordSpans.forEach(w => {
            let color;
            if (w.isBright) color = palette.highlights[0];
            else if (w.isBold) color = palette.petals[0];
            else color = palette.petals[(rowIndex + idCounter) % palette.petals.length];

            elements.push({
              id: `flower-elem-${idCounter++}`,
              phrase: getPhraseForWord(w.text),
              text: w.text,
              x: Math.round(curX + w.width / 2),
              y: y,
              width: w.width,
              height: w.fontSize + 4,
              fontSize: w.fontSize,
              fontWeight: w.isBold ? '800' : '600',
              color: color,
              part: 'petal',
              order: 0.32 + (1 - rowIndex / ROSE_HEAD.length) * 0.68,
              isGreen: false
            });
            curX += w.width + gap;
          });
        });
      }

      // Add Recipient Inscription if present
      if (RECIPIENT_NAME) {
        const heartEl = elements.find(e => e.part === 'petal' && Math.abs(e.x - cx) < 60 && Math.abs(e.y - cy) < 60);
        if (heartEl) {
          elements.push({
            id: 'recipient-inscription',
            phrase: {
              id: 'dedication',
              phrase: `For ${RECIPIENT_NAME}`,
              language: 'Dedication',
              native: RECIPIENT_NAME,
              pronunciation: RECIPIENT_NAME,
              flag: '💖',
              funFact: 'Dedicated with infinite affection.'
            },
            text: `★ ${RECIPIENT_NAME} ★`,
            x: cx,
            y: heartEl.y - 18,
            width: Math.round(RECIPIENT_NAME.length * 14 * 0.65),
            height: 18,
            fontSize: Math.round(13 * scale),
            fontWeight: '900',
            color: '#ffffff',
            part: 'petal',
            order: 0.99,
            isGreen: false
          });
        }
      }

      return elements;
    }

    // Canvas Resize & Setup
    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cachedElements = generateElements(currentFlower, rect.width, rect.height);
      draw();
    }

    // Render Canvas
    function draw() {
      const rect = container.getBoundingClientRect();
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, rect.width, rect.height);

      // Vignette effect
      const grad = ctx.createRadialGradient(rect.width / 2, rect.height * 0.45, 50, rect.width / 2, rect.height * 0.45, rect.width * 0.7);
      grad.addColorStop(0, 'rgba(255, 45, 117, 0.04)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0.9)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, rect.width, rect.height);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      cachedElements.forEach(el => {
        if (el.order > bloomProgress) return;

        const isHovered = hoveredElement && hoveredElement.id === el.id;
        ctx.font = `${el.fontWeight} ${el.fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif`;

        if (isHovered) {
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 14;
          ctx.fillStyle = '#ffffff';
        } else {
          ctx.shadowColor = el.color;
          ctx.shadowBlur = el.isGreen ? 3 : 5;
          ctx.fillStyle = el.color;
        }

        ctx.fillText(el.text, el.x, el.y);
      });

      // Reset shadow
      ctx.shadowBlur = 0;
    }

    // Animation Loop
    function stepBloom() {
      if (!isPlaying) return;
      bloomProgress += 0.006;
      if (bloomProgress >= 1.0) {
        bloomProgress = 1.0;
        isPlaying = false;
        playBtn.textContent = '▶';
      }
      bloomRange.value = bloomProgress;
      progressLabel.textContent = Math.round(bloomProgress * 100) + '%';
      draw();
      if (isPlaying) {
        animFrameId = requestAnimationFrame(stepBloom);
      }
    }

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '⏸' : '▶';
      if (isPlaying) {
        if (bloomProgress >= 1.0) bloomProgress = 0.0;
        stepBloom();
      } else {
        cancelAnimationFrame(animFrameId);
      }
    });

    resetBtn.addEventListener('click', () => {
      isPlaying = false;
      playBtn.textContent = '▶';
      cancelAnimationFrame(animFrameId);
      bloomProgress = 0.0;
      bloomRange.value = 0.0;
      progressLabel.textContent = '0%';
      draw();
      setTimeout(() => {
        isPlaying = true;
        playBtn.textContent = '⏸';
        stepBloom();
      }, 250);
    });

    bloomRange.addEventListener('input', (e) => {
      isPlaying = false;
      playBtn.textContent = '▶';
      cancelAnimationFrame(animFrameId);
      bloomProgress = parseFloat(e.target.value);
      progressLabel.textContent = Math.round(bloomProgress * 100) + '%';
      draw();
    });

    // Flower Switcher Tabs
    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach(tab => {
      if (tab.dataset.flower === currentFlower) tab.classList.add('active');
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFlower = tab.dataset.flower;
        const rect = container.getBoundingClientRect();
        cachedElements = generateElements(currentFlower, rect.width, rect.height);
        draw();
      });
    });

    // Hover & Click interaction
    function findElementAt(x, y) {
      for (const el of cachedElements) {
        if (el.order > bloomProgress) continue;
        const halfW = el.width / 2 + 4;
        const halfH = el.height / 2 + 2;
        if (x >= el.x - halfW && x <= el.x + halfW && y >= el.y - halfH && y <= el.y + halfH) {
          return el;
        }
      }
      return null;
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const hit = findElementAt(x, y);

      if (hit !== hoveredElement) {
        hoveredElement = hit;
        draw();
        if (hit) {
          tooltip.style.display = 'block';
          tooltip.style.left = hit.x + 'px';
          tooltip.style.top = (hit.y - 10) + 'px';
          tooltipLang.textContent = (hit.phrase.flag || '💖') + ' ' + (hit.phrase.language || 'World');
          tooltipText.textContent = '"' + hit.text + '" • ' + (hit.phrase.pronunciation || hit.phrase.phrase);
        } else {
          tooltip.style.display = 'none';
        }
      }
    });

    canvas.addEventListener('mouseleave', () => {
      hoveredElement = null;
      tooltip.style.display = 'none';
      draw();
    });

    // Click to pronounce speech
    canvas.addEventListener('click', () => {
      if (hoveredElement && window.speechSynthesis) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(hoveredElement.text);
          utterance.rate = 0.85;
          window.speechSynthesis.speak(utterance);
        } catch(e) {}
      }
    });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
